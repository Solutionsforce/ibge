<script>
// Facebook Pixel Event Tracking Functions
window.fbqTrackEvent = function(eventName, parameters = {}) {
    if (typeof fbq !== 'undefined') {
        console.log(`[FB Pixel] Tracking: ${eventName}`, parameters);
        fbq('track', eventName, parameters);
    }
};

// Track specific IBGE registration events
window.trackIBGERegistration = {
    // Track when user starts registration
    startRegistration: function(userData = {}) {
        fbqTrackEvent('InitiateCheckout', {
            content_name: 'IBGE Registration Start',
            content_category: 'Government Registration',
            value: 64.90,
            currency: 'BRL',
            ...userData
        });
    },
    
    // Track when user completes form sections
    completeFormSection: function(section, userData = {}) {
        fbqTrackEvent('CompleteRegistration', {
            content_name: `IBGE Registration - ${section} Completed`,
            content_category: 'Government Registration Form',
            status: 'completed',
            ...userData
        });
    },
    
    // Track when PIX is generated
    generatePIX: function(transactionId, userData = {}) {
        fbqTrackEvent('AddPaymentInfo', {
            content_name: 'IBGE Registration PIX Generated',
            content_category: 'Government Payment',
            value: 64.90,
            currency: 'BRL',
            transaction_id: transactionId,
            payment_method: 'PIX',
            ...userData
        });
    },
    
    // Track successful payment
    paymentSuccess: function(transactionId, userData = {}) {
        fbqTrackEvent('Purchase', {
            content_name: 'IBGE Registration Payment Success',
            content_category: 'Government Payment',
            value: 64.90,
            currency: 'BRL',
            transaction_id: transactionId,
            payment_method: 'PIX',
            ...userData
        });
    },
    
    // Track lead generation
    generateLead: function(position, userData = {}) {
        fbqTrackEvent('Lead', {
            content_name: `IBGE Registration Lead - ${position}`,
            content_category: 'Government Job Application',
            lead_type: 'job_application',
            position: position,
            ...userData
        });
    }
};

// Auto-track page views with enhanced data
document.addEventListener('DOMContentLoaded', function() {
    // Get page-specific info
    const pageName = document.title || 'IBGE Registration';
    const pageUrl = window.location.pathname;
    
    // Track specific page types
    if (pageUrl.includes('/login')) {
        fbqTrackEvent('ViewContent', {
            content_name: 'IBGE Login Page',
            content_category: 'Government Registration'
        });
    } else if (pageUrl.includes('/selecao-cargo')) {
        fbqTrackEvent('ViewContent', {
            content_name: 'IBGE Job Selection',
            content_category: 'Government Job Selection'
        });
    } else if (pageUrl.includes('/confirmacao-dados')) {
        fbqTrackEvent('ViewContent', {
            content_name: 'IBGE Data Confirmation',
            content_category: 'Government Registration Form'
        });
    } else if (pageUrl.includes('/selecao-local-prova')) {
        fbqTrackEvent('ViewContent', {
            content_name: 'IBGE Exam Location Selection',
            content_category: 'Government Registration'
        });
    } else if (pageUrl.includes('/checkout')) {
        fbqTrackEvent('ViewContent', {
            content_name: 'IBGE Payment Checkout',
            content_category: 'Government Payment'
        });
        
        // Also track checkout initiation
        fbqTrackEvent('InitiateCheckout', {
            content_name: 'IBGE Payment Checkout',
            content_category: 'Government Payment',
            value: 64.90,
            currency: 'BRL'
        });
    }
    
    console.log('[FB Pixel] Page tracking initialized for:', pageName);
});
</script>
