<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste PIX PayBets</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-6 text-center">Teste PIX com CPF 027.552.248-27</h1>
        
        <div class="mb-6">
            <button onclick="testarPIX()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded">
                Gerar PIX de Teste
            </button>
        </div>

        <div id="loading" class="hidden text-center py-4">
            <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-2 text-gray-600">Gerando PIX...</p>
        </div>

        <div id="resultado" class="hidden">
            <h2 class="text-xl font-semibold mb-4">Resultado:</h2>
            <div id="resultado-content" class="space-y-3"></div>
        </div>
    </div>

    <script>
        async function testarPIX() {
            const dados = {
                name: "João Silva Santos",
                cpf: "027.552.248-27", 
                email: "joao.silva@email.com",
                phone: "19999887766",
                amount: 6490,
                description: "Teste PIX completo - CPF 027.552.248-27 - CEP 13050-010"
            };

            // Mostrar loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultado').classList.add('hidden');

            try {
                console.log('Enviando dados:', dados);
                
                const response = await fetch('/gerar-pix', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dados)
                });

                const result = await response.json();
                console.log('Resultado:', result);
                
                // Esconder loading
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultado').classList.remove('hidden');
                
                const status = result.success ? 'SUCCESS ✅' : 'FAILED ❌';
                const statusClass = result.success ? 'text-green-600' : 'text-red-600';
                
                document.getElementById('resultado-content').innerHTML = `
                    <div class="border border-gray-200 rounded p-4">
                        <p class="font-bold ${statusClass}">${status}</p>
                        <p><strong>Payment ID:</strong> ${result.payment_id || 'Não gerado'}</p>
                        <p><strong>Status:</strong> ${result.status || 'N/A'}</p>
                        <p><strong>Valor:</strong> R$ ${result.amount ? (result.amount).toFixed(2) : '64,90'}</p>
                        <p><strong>PIX Code:</strong> ${result.pix_code ? 'Gerado (' + result.pix_code.length + ' caracteres)' : 'Não gerado'}</p>
                        <p><strong>QR Code:</strong> ${result.pix_qr_code ? 'Gerado ✅' : 'Não gerado ❌'}</p>
                        <p><strong>Demo Mode:</strong> ${result.paybets_demo ? 'Sim (Fallback)' : 'Não (Real)'}</p>
                        <p><strong>PIX Simulado:</strong> ${result.pix_simulado ? 'Sim' : 'Não'}</p>
                    </div>
                    
                    ${result.pix_code ? `
                        <div class="border border-gray-200 rounded p-4">
                            <p class="font-semibold mb-2">PIX Code (primeiros 100 caracteres):</p>
                            <textarea readonly class="w-full p-2 border rounded text-xs font-mono" rows="3">${result.pix_code.substring(0, 100)}...</textarea>
                        </div>
                    ` : ''}
                    
                    ${result.pix_qr_code ? `
                        <div class="border border-gray-200 rounded p-4 text-center">
                            <p class="font-semibold mb-3">QR Code PIX:</p>
                            <img src="${result.pix_qr_code}" alt="QR Code PIX" class="mx-auto max-w-xs border">
                            <p class="text-xs text-gray-600 mt-2">Escaneie com o app do seu banco</p>
                        </div>
                    ` : ''}
                    
                    ${result.expires_at ? `
                        <div class="bg-yellow-50 border border-yellow-200 rounded p-3">
                            <p class="text-sm"><strong>Expira em:</strong> ${new Date(result.expires_at).toLocaleString('pt-BR')}</p>
                        </div>
                    ` : ''}
                `;
                
            } catch (error) {
                // Esconder loading
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultado').classList.remove('hidden');
                
                console.error('Erro:', error);
                document.getElementById('resultado-content').innerHTML = `
                    <div class="border border-red-200 rounded p-4 bg-red-50">
                        <p class="font-bold text-red-600">ERRO ❌</p>
                        <p class="text-red-700">${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
